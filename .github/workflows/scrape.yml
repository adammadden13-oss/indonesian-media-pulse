name: Scheduled Media & Trends Pipeline

on:
  schedule:
    - cron: '0 0 * * *'  # Diubah dari setiap 2 jam ('0 */2 * * *') menjadi 1 kali sehari (pukul 00:00 UTC / 07:00 WIB)
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          pip install -r requirements.txt

      - name: 1. Eksekusi Scraper Infotainment & Selebriti
        run: |
          python scraper.py || true

      - name: 2. Eksekusi Scraper Berita General News
        run: |
          python news_scraper.py || true

      - name: 3. Eksekusi Trending Tracker (Portal & Sosmed)
        run: |
          python trending_tracker.py || true

      - name: 4. Eksekusi Tracker Film & Hiburan
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python entertainment_tracker.py || true

      - name: 5. Eksekusi Analisis Sentimen NLP
        run: |
          python sentiment_analyzer.py || true

      - name: 6. Eksekusi Tracker Ekonomi & Audio
        run: |
          python ekonomi_audio_tracker.py || true

      - name: 7. Buat Word Cloud & Arsip Historis
        run: |
          python archive_wordcloud.py || true

      - name: Commit dan Simpan Seluruh Dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update data pipeline: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push

