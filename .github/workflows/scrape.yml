name: Scheduled Scraper & Trending Tracker

on:
  schedule:
    # Berjalan otomatis setiap 2 jam
    - cron: '0 */2 * * *'
  workflow_dispatch: # Tombol eksekusi manual

jobs:
  scrape_and_trend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          pip install -r requirements.txt

      - name: Eksekusi Berita Terkini
        run: |
          python scraper.py

      - name: Eksekusi Trending Tracker
        run: |
          python trending_tracker.py

      - name: Commit dan Simpan Semua Data Terbaru
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add berita_terkini.csv berita_trending.csv scraper.log
          git commit -m "Update berita & trending: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
