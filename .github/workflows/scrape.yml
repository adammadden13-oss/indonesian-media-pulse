name: Scheduled Scraper

on:
  schedule:
    # Berjalan otomatis setiap 2 jam
    - cron: '0 */2 * * *'
  workflow_dispatch: # Tombol untuk menjalankan manual kapan saja

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Izin bot untuk menyimpan/commit data ke repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          pip install -r requirements.txt

      - name: Eksekusi Scraper
        run: |
          python scraper.py

      - name: Commit dan Simpan CSV Terbaru
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wolipop_news_feed.csv scraper.log
          git commit -m "Auto-update data: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
